[package]
name = "linger-core"
description = "Translation model, importers, search and study storage for linger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["bundled", "native"]
# Embed the public-domain translations and the Ask data from data/ into the binary. Without it
# the bytes come from a `bundled::Source` installed at runtime (the web fetches them).
bundled = []
# Everything that needs the OS or a C library: SQLite, the network (`ureq`), WAV files, imports,
# the zstd C library and the Keychain, and with them the API client and Ask. Off only for the
# wasm build (docs/plans/m8-web.md), which decodes with the pure-Rust `ruzstd`.
native = ["dep:rusqlite", "dep:ureq", "dep:hound", "dep:zip", "dep:flate2", "dep:zstd", "dep:uuid"]
# The sync engine (sync.rs): the cache, the outbox and the change feed behind `sync::Backend`.
sync = ["native"]
# The native Convex backend: the `convex` crate on a current-thread tokio runtime.
convex = ["sync", "dep:convex", "dep:tokio", "dep:futures"]
# AAC encoding through AudioToolbox's `AudioConverter` (`recording::aac`), on macOS and iOS.
apple-audio = ["dep:objc2-audio-toolbox", "dep:objc2-core-audio-types"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = "1"
memchr.workspace = true
zstd = { workspace = true, optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
flate2 = { version = "1", optional = true }
ureq = { version = "3", optional = true }
hound = { version = "3.5", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
sha2 = "0.10"
# rustls, as ureq already uses, rather than the crate's default vendored OpenSSL.
convex = { version = "0.10", optional = true, default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", optional = true, features = ["rt", "time", "sync"] }
futures = { version = "0.3", optional = true, default-features = false, features = ["std"] }

# The wasm build (the only one without `native`): the pure-Rust zstd decoder in place of the C
# library, and `web-time` because `std::time::Instant` panics there (`search` times itself).
[target.'cfg(target_arch = "wasm32")'.dependencies]
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
web-time = "1"

# API keys live in the macOS Keychain; other platforms use a 0600 file.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = "4"

# The AAC encoder: the same AudioToolbox C API on macOS and iOS, bound by objc2's generated crates.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-audio-toolbox = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "AudioConverter",
    "objc2-core-audio-types",
] }
objc2-core-audio-types = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "CoreAudioBaseTypes",
] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[example]]
name = "convex_tokens"
required-features = ["convex"]

[[bench]]
name = "search"
harness = false

[[bench]]
name = "load"
harness = false
