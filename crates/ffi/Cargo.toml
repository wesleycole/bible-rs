[package]
name = "linger-ffi"
description = "Swift (and Kotlin) bindings to linger-core for the mobile apps, generated with UniFFI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "linger_ffi"
# staticlib for the iOS XCFramework; cdylib so uniffi-bindgen can read the interface on any host.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
anyhow.workspace = true
# The sync engine over Convex, as the desktop runs it.
linger-core = { workspace = true, features = ["convex"] }
thiserror.workspace = true
uniffi.workspace = true
