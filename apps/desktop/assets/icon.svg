<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The Linger mark (trylinger/linger), an arch, drawn as a lit doorway: warm light glows around
       it and spills onto the floor of an ink tile. On the macOS icon grid the tile is 824 px with
       a 100 px margin. The iOS icon (apps/ios/Linger/Assets.xcassets) is the tile alone, full
       bleed, and `app_icon` in apps/desktop/src/onboarding.rs draws the same picture in the app. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2723"/><stop offset="1" stop-color="#121010"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/><stop offset="1" stop-color="#F5E4C4"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="540" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8B96E" stop-opacity="0.20"/><stop offset="1" stop-color="#E8B96E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spill" x1="0" y1="730" x2="0" y2="910" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5E4C4" stop-opacity="0.26"/><stop offset="1" stop-color="#F5E4C4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.20"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.03"/><stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <clipPath id="tc"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <g id="shadow"><rect x="100" y="112" width="824" height="824" rx="186" fill="#000" opacity="0.32" filter="url(#drop)"/></g>
  <g id="art">
    <rect id="ground" x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
    <g clip-path="url(#tc)">
      <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
      <path d="M330 730 L694 730 L790 910 L234 910 Z" fill="url(#spill)" filter="url(#blur)"/>
    </g>
    <path d="M330 730 V430 A182 182 0 0 1 694 430 V730 Z" fill="#F2D49E" opacity="0.30" filter="url(#halo)"/>
    <path d="M330 730 V430 A182 182 0 0 1 694 430 V730 Z" fill="url(#arch)"/>
  </g>
  <g id="rimline"><rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="url(#rim)" stroke-width="4"/></g>
</svg>
