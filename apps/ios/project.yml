# XcodeGen spec for the iPhone and iPad app: `xcodegen` in this folder writes Linger.xcodeproj
# (not checked in). Run scripts/build-ios-core.sh first so LingerCore has its XCFramework.
name: Linger
options:
  bundleIdPrefix: com.wesleycole
  # Keep in step with scripts/build-ios-core.sh and LingerCore/Package.swift.
  deploymentTarget:
    iOS: "17.0"
packages:
  LingerCore:
    path: LingerCore
targets:
  Linger:
    type: application
    platform: iOS
    sources: [Linger]
    dependencies:
      - package: LingerCore
    settings:
      base:
        PRODUCT_NAME: Linger
        # Continues the existing Linger app (same bundle ID and team), so TestFlight treats this as
        # a new build of it. Each upload needs a build number above the last one (29 was the last
        # build of the previous app).
        PRODUCT_BUNDLE_IDENTIFIER: com.wesleycole.linger
        DEVELOPMENT_TEAM: 66W3WWYP3B
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 30
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Linger
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic
