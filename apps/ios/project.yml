# XcodeGen spec for the iPhone and iPad app: `xcodegen` in this folder writes Linger.xcodeproj
# (not checked in). Run scripts/build-ios-core.sh first so LingerCore has its XCFramework.
name: Linger
options:
  bundleIdPrefix: com.wesleycole
  # Keep in step with scripts/build-ios-core.sh and LingerCore/Package.swift.
  deploymentTarget:
    iOS: "17.0"
packages:
  LingerCore:
    path: LingerCore
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: 1.6.1
targets:
  Linger:
    type: application
    platform: iOS
    sources: [Linger]
    dependencies:
      - package: LingerCore
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
    entitlements:
      path: Linger/Linger.entitlements
      properties:
        # Passkeys: Clerk's Frontend API is the relying party (clerk.trylinger.com from the cut-over).
        com.apple.developer.associated-domains:
          - webcredentials:elegant-mink-67.clerk.accounts.dev
    scheme:
      testTargets: [LingerUITests, LingerTests]
      # Pro's two subscriptions for runs and UI tests on the simulator, answered by Xcode instead of
      # the App Store; the proxy accepts them with APPLE_ENVIRONMENT=Xcode.
      storeKitConfiguration: Linger.storekit
    settings:
      base:
        PRODUCT_NAME: Linger
        # Continues the existing Linger app (same bundle ID and team), so TestFlight treats this as
        # a new build of it. Each upload needs a build number above the last one (29 was the last
        # build of the previous app).
        PRODUCT_BUNDLE_IDENTIFIER: com.wesleycole.linger
        DEVELOPMENT_TEAM: 66W3WWYP3B
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 30
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Linger
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic
        # The XCFramework's simulator slice is Apple Silicon only (scripts/build-ios-core.sh), so
        # don't build for Intel simulators.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
      configs:
        Debug:
          "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Linger/Linger-Simulator.entitlements
  # One headless check of the sign-in contract: Clerk's test address and code reach the reader.
  LingerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LingerUITests]
    dependencies:
      - target: Linger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesleycole.linger.uitests
        DEVELOPMENT_TEAM: 66W3WWYP3B
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  # Runs inside the app: storekitd accepts a StoreKit test session only from the app's own identity,
  # and xcodebuild doesn't load the scheme's StoreKit configuration for UI tests. Skips without
  # pnpm dev and LINGER_TEST_TOKEN (see PurchaseTests.swift); CI neither builds nor runs it.
  LingerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LingerTests]
    dependencies:
      - target: Linger
      - package: LingerCore
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesleycole.linger.tests
        DEVELOPMENT_TEAM: 66W3WWYP3B
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Linger.app/Linger"
        BUNDLE_LOADER: "$(TEST_HOST)"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
